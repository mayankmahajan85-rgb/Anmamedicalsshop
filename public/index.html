<head>

  <title>ANMA Medicals</title>
  <link rel="icon" href="img/favicon.png">
  <script>
    (function () {
      var ok = ['en', 'nl', 'de', 'fr'], l = null;
      try { l = localStorage.getItem('anma_lang'); } catch (e) {}
      if (ok.indexOf(l) < 0) {
        var n = ((navigator.language || 'en') + '').slice(0, 2).toLowerCase();
        l = ok.indexOf(n) >= 0 ? n : 'en';
      }
      location.replace(l + '/index.html');
    })();
  </script>
</head>

</body>
